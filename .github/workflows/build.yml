name: Build and Test

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build & Run Unit Tests
    runs-on: windows-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore ClipboardManager.sln

    - name: Build solution (Release)
      run: dotnet build ClipboardManager.sln --configuration Release --no-restore

    - name: Run unit tests
      run: dotnet test ClipboardManager.sln --configuration Release --no-build --verbosity normal
